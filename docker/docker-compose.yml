version: '3.8'

services:
  fleet-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: discord-fleet-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - fleet-data:/app/data
      - fleet-logs:/app/logs
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { if (res.statusCode !== 200) process.exit(1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  fleet-network:
    driver: bridge

volumes:
  fleet-data:
    driver: local
  fleet-logs:
    driver: local