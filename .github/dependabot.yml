# Dependabot configuration for automated dependency updates
version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    assignees:
      - "phantom1785322-hub"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "typescript*"
          - "vitest*"
          - "tsx*"
          - "tsc-alias*"
      production-dependencies:
        patterns:
          - "discord.js"
          - "express"
          - "ws"
          - "better-sqlite3"
          - "zod"
          - "cors"
          - "yaml"
      react-ecosystem:
        patterns:
          - "react*"
          - "@radix-ui/*"
          - "@tanstack/*"
          - "zustand"
          - "clsx"
          - "tailwind-merge"
          - "lucide-react"
          - "date-fns"
          - "cytoscape"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # reviewers:
    #   - "phantom1785322-hub"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"